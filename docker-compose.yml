version: '3.8'

services:
  # Hyper Messenger Frontend
  hyper-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hyper-web
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - hyper-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx reverse proxy (optional, for production)
  nginx-proxy:
    image: nginx:alpine
    container_name: hyper-nginx
    ports:
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - hyper-web
    restart: unless-stopped
    networks:
      - hyper-network
    profiles:
      - production

networks:
  hyper-network:
    driver: bridge
